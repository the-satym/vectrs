<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Vectrs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050816;
    --card:rgba(17,24,39,.7);
    --border:rgba(255,255,255,.08);
    --text:#fff;
    --muted:#94a3b8;
    --primary:#6366f1;
    --secondary:#06b6d4;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top left,#312e81 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0891b2 0%,transparent 35%),
    var(--bg);

    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:450px;

    background:var(--card);

    backdrop-filter:blur(20px);

    border:1px solid var(--border);

    border-radius:24px;

    padding:40px;
}

.logo{
    text-align:center;
    font-size:2rem;
    font-weight:800;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:35px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:.95rem;
}

input{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.03);
    color:white;
    outline:none;
}

input:focus{
    border-color:var(--primary);
}

.options{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    font-size:.9rem;
}

.options a{
    color:#60a5fa;
    text-decoration:none;
}

.btn{
    width:100%;
    border:none;
    cursor:pointer;

    padding:15px;

    border-radius:12px;

    background:linear-gradient(
    135deg,
    var(--primary),
    var(--secondary)
    );

    color:white;
    font-weight:600;
    font-size:1rem;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:25px 0;
    color:var(--muted);
}

.divider::before,
.divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--border);
}

.social{
    display:flex;
    gap:12px;
}

.social button{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:transparent;
    color:white;
    cursor:pointer;
}

.bottom{
    text-align:center;
    margin-top:25px;
    color:var(--muted);
}

.bottom a{
    color:#60a5fa;
    text-decoration:none;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">Vectrs</div>

<p class="subtitle">
Welcome back. Sign in to continue.
</p>

<form>

<div class="form-group">
<label>Email</label>
<input type="email" placeholder="you@example.com">
</div>

<div class="form-group">
<label>Password</label>
<input type="password" placeholder="••••••••">
</div>

<div class="options">
<label>
<input type="checkbox">
 Remember me
</label>

<a href="#">Forgot password?</a>
</div>

<button class="btn">
Sign In
</button>

</form>

<div class="divider">
OR
</div>

<div class="social">
<button>Google</button>
<button>GitHub</button>
</div>

<div class="bottom">
Don't have an account?
<a href="signup.html">Create one</a>
</div>

</div>

</body>
</html>
