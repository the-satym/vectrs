<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | Vectrs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050816;
    --card:rgba(17,24,39,.7);
    --border:rgba(255,255,255,.08);
    --text:#fff;
    --muted:#94a3b8;
    --primary:#6366f1;
    --secondary:#06b6d4;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;

    background:
    radial-gradient(circle at top left,#312e81 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0891b2 0%,transparent 35%),
    var(--bg);

    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:500px;

    background:rgba(17,24,39,.7);

    backdrop-filter:blur(20px);

    border:1px solid var(--border);

    border-radius:24px;

    padding:40px;
}

.logo{
    text-align:center;
    font-size:2rem;
    font-weight:800;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin:10px 0 30px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px 16px;

    border-radius:12px;

    border:1px solid var(--border);

    background:rgba(255,255,255,.03);

    color:white;
    outline:none;
}

input:focus{
    border-color:var(--primary);
}

.btn{
    width:100%;
    margin-top:10px;

    padding:15px;

    border:none;

    border-radius:12px;

    background:linear-gradient(
    135deg,
    var(--primary),
    var(--secondary)
    );

    color:white;
    font-weight:600;
    cursor:pointer;
}

.terms{
    color:var(--muted);
    font-size:.9rem;
    margin-top:15px;
}

.terms a{
    color:#60a5fa;
}

.bottom{
    text-align:center;
    margin-top:25px;
    color:var(--muted);
}

.bottom a{
    color:#60a5fa;
    text-decoration:none;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">Vectrs</div>

<p class="subtitle">
Create your account and start building.
</p>

<form>

<div class="form-group">
<label>Full Name</label>
<input type="text" placeholder="Satyam Singh">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" placeholder="you@example.com">
</div>

<div class="form-group">
<label>Password</label>
<input type="password" placeholder="Create a strong password">
</div>

<div class="form-group">
<label>Confirm Password</label>
<input type="password" placeholder="Repeat your password">
</div>

<button class="btn">
Create Account
</button>

<p class="terms">
By signing up you agree to our
<a href="#">Terms</a> and
<a href="#">Privacy Policy</a>.
</p>

</form>

<div class="bottom">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

</body>
</html>
